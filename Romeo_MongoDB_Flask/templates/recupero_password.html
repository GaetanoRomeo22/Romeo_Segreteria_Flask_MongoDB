<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Link al foglio di stile css -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- Link al foglio di stile css -->

    <!-- Meta tag for PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="white">
    <meta name="description" content="PreviewReading">
    <!-- Meta tag for PWA -->

    <!--Specific meta tag for IOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="PreviewReading">
    <!--Specific meta tag for IOS -->

    <!-- Specific meta tag for OS Windows -->
    <meta name="application-name" content="PreviewReading">
    <meta name="msapplication-TitleImage" content="images/144x144.png">
    <meta name="msapplication-TitleColor" content="#cc194b">
    <!-- Specific meta tag for OS Windows -->

    <title>Recupero Password</title>
</head>
<body>
<!-- Logo -->
<header class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Università">
</header>
<!-- Logo -->

<!-- Form di reset della password -->
<div id="reset-container" class="container">
    <h2>Recupero Password</h2>
    <form id="reset-form">
        <!-- Matricola -->
        <div class="matricola-container">
            <i class="fa-solid fa-user"></i>
            <label for="reset-matricola"></label><input type="text" pattern="\d*" id="reset-matricola" class="matricola" name="matricola" required placeholder="Matricola">
        </div>
        <!-- Matricola -->

        <!-- Email -->
        <div id="email-container">
            <i class="fa-solid fa-envelope"></i>
            <label for="email"></label><input type="email" id="email" name="email" required placeholder="Email Istituzionale">
        </div>
        <!-- Email -->

        <!-- Pulsante di invio email di recupero -->
        <input id="reset-button" type="submit" value="Invia email di recupero">
        <!-- Pulsante di invio email di recupero -->
    </form>
    <!-- Pulsante di ritorno al login -->
    <p id="back-to-login">
        <a href="{{ url_for('index') }}">Login</a>
    </p>
    <!-- Pulsante di ritorno al login -->
</div>
<!-- Form di reset della password -->
<!-- JavaScript lato server -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous" async></script>
<!-- JavaScript lato server -->
</body>
</html>
