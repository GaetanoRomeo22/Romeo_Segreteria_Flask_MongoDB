<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Link al foglio di stile css -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <!-- Link al foglio di stile css -->

  <!-- Meta tag for PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="white">
  <meta name="description" content="PreviewReading">
  <!-- Meta tag for PWA -->

  <!--Specific meta tag for IOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PreviewReading">
  <!--Specific meta tag for IOS -->

  <!-- Specific meta tag for OS Windows -->
  <meta name="application-name" content="PreviewReading">
  <meta name="msapplication-TitleImage" content="images/144x144.png">
  <meta name="msapplication-TitleColor" content="#cc194b">
  <!-- Specific meta tag for OS Windows -->

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap -->

  <title>Segreteria</title>
</head>
<body>
<!-- Logo -->
<header class="logo">
  <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Università">
</header>
<!-- Logo -->

<!-- Form di Login -->
<div id="login-container" class="container">
  <h2>Autenticazione</h2>
  <form id="login-form" method="post" action="{{ url_for('login') }}">
    <!-- Matricola -->
    <div class="matricola-container">
      <i class="fa-solid fa-user"></i>
      <label for="login-matricola"></label>
      <input type="text" pattern="\d*" class="matricola" id="login-matricola" name="matricola" required placeholder="Matricola" autocomplete="off">
    </div>
    <!-- Matricola -->

    <!-- Password -->
    <div id="password-container">
      <i class="fa-solid fa-lock"></i>
      <label for="login-password"></label>
      <input type="password" id="login-password" class="password" name="password" required placeholder="Password" autocomplete="off">
      <button class="showhide_passw" type="button" aria-label="Mostra/Nascondi password">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>
    <!-- Password -->

    <!-- Pulsante di Login -->
    <input id="login-button" type="submit" value="Accedi">
    <!-- Pulsante di Login -->

    <!-- Link alla registrazione -->
    <p id="register-link">
      <a href="{{ url_for('show_register') }}">Non hai un account? Registrati</a>
    </p>
    <!-- Link alla registrazione -->

    <!-- Recupero password -->
    <p id="forgot-password">
      <a href="{{ url_for('show_retrieve_password') }}">Password dimenticata?</a>
    </p>
    <!-- Recupero password -->
  </form>
      <p id="login-error-message" class="error-message">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
</div>
<!-- Form di Login -->

<!-- JavaScript lato client -->
<script>
  document.querySelector('.showhide_passw').addEventListener('click', function () {
    const passwordInput = document.getElementById('login-password');
    const icon = this.querySelector('i');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  });
</script>
<!-- JavaScript lato client -->

<!-- JavaScript lato server -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous" async></script>
<!-- JavaScript lato server -->
</body>
</html>
